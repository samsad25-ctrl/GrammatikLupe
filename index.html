<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GrammatikLupe</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <div class="language">
      <button id="btnDeutsch" type="button">Deutsch</button>
      <button id="btnChinesisch" type="button">中文</button>
    </div>

    <header>
      <h1>GrammatikLupe</h1>

      <p id="subtitle" class="subtitle">
        Diagnostische Analyse für deutsche Lernertexte
      </p>
    </header>

    <section>
      <h2 id="inputTitle">Text eingeben</h2>

      <p id="inputInstruction">
        Füge deinen unveränderten deutschen Text in das Feld ein.
      </p>

      <textarea
        id="studentText"
        placeholder="Füge deinen Text hier ein …"
        spellcheck="false"
      ></textarea>

      <p id="wordCounter">0 Wörter</p>

      <button
        id="analyseButton"
        class="analyse"
        type="button"
      >
        Text analysieren
      </button>
    </section>

    <section id="resultSection" class="result" hidden>
      <h2 id="resultTitle">
        Empfohlene Themen zum Wiederholen
      </h2>

      <div id="resultMessage">
        Noch keine Analyse durchgeführt.
      </div>
    </section>

  </main>

<script src="observations.js"></script>
<script src="learningTopics.js"></script>
<script src="diagnosisEngine.js"></script>
<script src="morphologyAdapter.js"></script>
<script src="determinerRules.js"></script>
<script src="nominalGroupRules.js"></script>
<script src="caseRules.js"></script>
<script src="twoWayPrepositionRules.js"></script>
<script src="temporalPrepositionRules.js"></script>
<script src="parser.js"></script>
<script src="script.js"></script>
</body>
</html>
